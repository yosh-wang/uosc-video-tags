# ==========================================
# 左下角标签 (MediaInfo) 完整配置
# 所有修改都在此文件，无需改动 main.lua
# ==========================================

# ==========================================
# 全局开关
# ==========================================

# 启用/禁用标签显示 (yes/no)
mediainfo_enabled=yes

# 视频开始时自动显示时长 (秒)，0 为关闭此功能
mediainfo_initial_display=5

# ==========================================
# 尺寸配置
# ==========================================

# 字体大小 (scale 倍数，原版 9.8，1.2倍 12，1.5倍 14)
mediainfo_font_size=12

# 距离控制栏偏移 (越大标签越靠上)
mediainfo_y_offset=23

# 标签间距
mediainfo_gap=5

# 左右内边距
mediainfo_x_padding=6

# 上下内边距
mediainfo_y_padding=3

# ==========================================
# 固定尺寸模式
# ==========================================

# 缩放强度 (0.0=不缩放  0.5=半缩放  1.0=完全跟随窗口)
mediainfo_scale_intensity=0.30

# 渐变主题 (高亮标签背景) 共17个
# bbblurry / lavender / amethyst / sapphire / midnight
# crimson / magenta / amber / gold / bubblegum
# blush / coral / plasma / electric / autumn / rust / aurora
# custom - 手动调色
mediainfo_theme=bbblurry


# ==========================================
# 手动调色 (仅当 mediainfo_theme=custom 时生效)
# ==========================================

# 底色 (标签底层背景)
mediainfo_gradient_base=090916

# 椭圆1 (右侧深紫)
mediainfo_gradient_c1=6419a9

# 椭圆2 (中部洋红)
mediainfo_gradient_c2=710a44

# 椭圆3 (极左暗紫)
mediainfo_gradient_c3=693bb5

# 椭圆4 (左下亮蓝)
mediainfo_gradient_c4=4ea3d5

# ==========================================
# 普通标签颜色 (HEX 格式，不含 #)
# ==========================================

# 解码方式 (硬解/软解)
mediainfo_color_hwdec=000000

# 视频编码 (AVC/HEVC/AV1/VP9)
mediainfo_color_codec=000000

# 分辨率 (4K UHD/1080P/720P)
mediainfo_color_res=000000

# 帧率
mediainfo_color_fps=000000

# 音频声道
mediainfo_color_audio_layout=000000

# 音频编码
mediainfo_color_audio_codec=000000
