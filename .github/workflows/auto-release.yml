name: Manual Release with Commit Messages

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 v7.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Package portable_config
        id: prepare
        run: |
          # 直接打包 portable_config 整个目录
          cd portable_config
          zip -r ../uosc-video-tags-${{ github.event.inputs.version }}.zip .
          cd ..

          echo "ZIP=uosc-video-tags-${{ github.event.inputs.version }}.zip" >> $GITHUB_OUTPUT

      - name: Get commit messages since last tag
        id: commit_msgs
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "LAST_TAG=${LAST_TAG}" >> $GITHUB_OUTPUT

          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" -n 50)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)")
          fi

          echo "MSG<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.prepare.outputs.ZIP }}
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body: |
            ## ⭐ 下载量
            [![Downloads](https://img.shields.io/github/downloads/${{ github.repository }}/${{ github.event.inputs.version }}/total?cacheSeconds=300)](https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.version }})

            ### 📦 包含内容

            已打包完整的 `portable_config/` 目录，包含：

            | 文件 | 路径 |
            |------|------|
            | `MediaInfo.lua` | `scripts/uosc/elements/MediaInfo.lua` |
            | `mediainfo.conf` | `script-opts/mediainfo.conf` |
            | `标签说明.txt` | `标签说明.txt` |
            | `load snippet` | **需手动追加** 见下方说明 |

            ### 🚀 使用方法

            **方式一（推荐）：** 下载 zip 包，直接解压覆盖到 mpv 安装目录的 `portable_config/` 文件夹即可。

            **方式二：** 单独使用
            1. 从 zip 中取出 `scripts/uosc/elements/MediaInfo.lua` 放到你的 `scripts/uosc/elements/` 目录
            2. 从 zip 中取出 `script-opts/mediainfo.conf` 放到你的 `script-opts/` 目录
            3. 在你的 `scripts/uosc/main.lua` **末尾追加一行**：
            ```lua
            require('elements/MediaInfo'):new()
            ```

            > 💡 **无需 ffprobe，无需外部模块**，单文件自包含。
            >
            > 💡 `MediaInfo.lua` 必须配合 **uosc 的 main.lua** 使用（基于 uosc 独立 Element 机制）。

            ### 更新内容
            ${{ steps.commit_msgs.outputs.MSG }}

            **完整更新日志**：[${{ steps.commit_msgs.outputs.LAST_TAG }}...${{ github.event.inputs.version }}](${{ github.server_url }}/${{ github.repository }}/compare/${{ steps.commit_msgs.outputs.LAST_TAG }}...${{ github.event.inputs.version }})
