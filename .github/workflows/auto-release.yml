name: Manual Release with Commit Messages

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 v7.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare release files
        id: prepare
        run: |
          # 复制发布文件到 release/ 目录，保持子目录结构
          mkdir -p release/scripts/uosc/elements
          mkdir -p release/script-opts

          cp portable_config/scripts/uosc/elements/MediaInfo.lua release/scripts/uosc/elements/MediaInfo.lua
          cp portable_config/script-opts/mediainfo.conf              release/script-opts/mediainfo.conf

          # 生成 main.lua 追加说明 snippet（用户复制到 uosc/main.lua 末尾）
          cat > release/load_mediainfo_snippet.lua <<'SNIP'
-- 加载视频技术标签独立模块 (MediaInfo)
require('elements/MediaInfo'):new()
SNIP

          # 打包 zip（保留 portable_config 目录结构，方便直接覆盖）
          cd release
          zip -r ../uosc-video-tags-${{ github.event.inputs.version }}.zip .
          cd ..

          echo "ZIP=uosc-video-tags-${{ github.event.inputs.version }}.zip" >> $GITHUB_OUTPUT

      - name: Get commit messages since last tag
        id: commit_msgs
        run: |
          # 获取上一个 tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "LAST_TAG=${LAST_TAG}" >> $GITHUB_OUTPUT

          # 获取提交信息
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" -n 50)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)")
          fi

          # 输出多行
          echo "MSG<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.prepare.outputs.ZIP }}
            portable_config/scripts/uosc/elements/MediaInfo.lua
            portable_config/script-opts/mediainfo.conf
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body: |
            ## ⭐ 下载量
            [![Downloads](https://img.shields.io/github/downloads/${{ github.repository }}/${{ github.event.inputs.version }}/total?cacheSeconds=300)](https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.version }})

            ### 📦 包含文件

            | 文件 | 放置路径 |
            |------|----------|
            | `MediaInfo.lua` | `scripts/uosc/elements/MediaInfo.lua` |
            | `mediainfo.conf` | `script-opts/mediainfo.conf` |

            ### 🚀 安装方法（3 步）

            1. 下载 `MediaInfo.lua` 放到 `scripts/uosc/elements/` 目录
            2. 下载 `mediainfo.conf` 放到 `script-opts/` 目录
            3. 在 `scripts/uosc/main.lua` **末尾追加一行**：
            ```lua
            require('elements/MediaInfo'):new()
            ```

            > 💡 **无需 ffprobe，无需外部模块**，3 个文件即可使用。
            >
            > 💡 也可以直接下载 zip 包，覆盖到 `portable_config/` 目录（包含子目录结构）。

            ### 更新内容
            ${{ steps.commit_msgs.outputs.MSG }}

            **完整更新日志**：[${{ steps.commit_msgs.outputs.LAST_TAG }}...${{ github.event.inputs.version }}](${{ github.server_url }}/${{ github.repository }}/compare/${{ steps.commit_msgs.outputs.LAST_TAG }}...${{ github.event.inputs.version }})
